<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
</head>
<body style="background-color: #414141; color: #ffff;">
    <h2>Amazing images</h2>
    <div>
        <ul id="images">
            <li><img width="200px" id="elephant" src="https://hatrabbits.com/wp-content/uploads/2017/01/random.jpg" alt="elepht-img"></li>
            <li><img width="200px" height="150px" id="bulb" src="https://images.unsplash.com/photo-1493612276216-ee3925520721?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTV8fHJhbmRvbXxlbnwwfHwwfHx8MA%3D%3D" alt="bulb-img"></li>
            <li><img width="200px" height="150px" id="candies" src="https://images.pexels.com/photos/4016579/pexels-photo-4016579.jpeg?cs=srgb&dl=pexels-karolina-grabowska-4016579.jpg&fm=jpg" alt="candy-img"></li>
            <li><img width="200px" height="150px" id="street" src="https://media.istockphoto.com/id/1351290920/photo/homeless-male-eating-takeaway-burger.jpg?s=612x612&w=0&k=20&c=kv_EqFi4Giy0DrpRB_8sbnnGJq005WK2YcP3tlicFlU=" alt="street-img"></li>
            <li><a style="color: aliceblue;" href="" id="google">Google</a></li>
        </ul>
    </div>
</body>
<script>
    //way 1: 
    // document.getElementById('elephant').onclick = function(){
    //     alert('You clicked on the elephant image');
    // }

    //attachEvent
    //jQuery - on (event)
    //types, timestamp, preventDefault
    //target, toElement, sourceElement, currentTarget
    //clientX, clientY, screenX, screenY
    //altKey, ctrlKey, shiftKey, keyCode

    //way 2:
    document.getElementById('bulb').addEventListener('click', (e) => {
        console.log("bulb");
    }, false);

    document.getElementById('images').addEventListener('click', (e) => {
        console.log("Clicked inside the ul");
    }, false);

    document.getElementById('elephant').addEventListener('click', (e) => {
        console.log("Elephant");
        // e.stopPropagation();
    }, false);

    document.getElementById('google').addEventListener('click', (e) => {
        console.log("google clicked");
        // e.preventDefault();
        // e.stopPropagation();
    }, false);

    document.querySelector('#images').addEventListener('click', (e) => {
        console.log(e.target.tagName);
        if(e.target.tagName === 'IMG'){
            console.log(e.target.id);
            let removeIt = e.target.parentNode;
            removeIt.remove();
        }

        // removeIt.parentNode.removeChild(removeIt);
    }, false);
</script>
</html>
